# Settings come from .env.deploy (not in git), loaded here, see GETTING_STARTED.md.
# Variables already set in the shell win.
#   bin/kamal setup    # first time: starts the database, then deploys
#   bin/kamal deploy   # after that
<% require "dotenv"; Dotenv.load(".env.deploy") %>
service: tash_chess
image: tash_chess

servers:
  web:
    - 152.53.142.188

# kamal-proxy serves the app on this host and gets a Let's Encrypt certificate for it.
proxy:
  ssl: true
  host: <%= ENV.fetch("TASH_CHESS_HOST") %>
  app_port: 80

# A registry on this machine; the server pulls the image through the SSH connection.
registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
    - TASH_CHESS_DATABASE_PASSWORD
    - BASIC_AUTH_USERNAME
    - BASIC_AUTH_PASSWORD
  clear:
    # The db accessory below, on Kamal's Docker network.
    PGHOST: tash_chess-db
    # Run the Solid Queue supervisor inside Puma. Live updates are sent by a job, so this is required.
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests.
asset_path: /rails/public/assets

builder:
  arch: amd64

ssh:
  user: deploy

accessories:
  db:
    image: postgres:16
    host: 152.53.142.188
    env:
      clear:
        POSTGRES_USER: tash_chess
        POSTGRES_DB: tash_chess_production
      secret:
        - POSTGRES_PASSWORD:TASH_CHESS_DATABASE_PASSWORD
    directories:
      - tash_chess_postgres_data:/var/lib/postgresql/data
    options:
      restart: unless-stopped
